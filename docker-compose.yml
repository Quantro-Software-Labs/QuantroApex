services:
  postgres:
    image: postgres:16-alpine
    container_name: quantroapex-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: quantroapex
      POSTGRES_PASSWORD: quantroapex_dev
      POSTGRES_DB: quantroapex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantroapex -d quantroapex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quantroapex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - v2

volumes:
  postgres_data:
